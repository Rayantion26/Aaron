<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <nav class="navbar navbar-light bg-white shadow-sm mb-5">
        <div class="container">
            <div class="d-flex align-items-center">
                <a href="/" class="text-decoration-none me-3" style="font-size: 1.5rem; line-height: 1;" title="Return Home">🏠</a>
                <span class="navbar-brand mb-0 h1">Bootstrap Demo</span>
            </div>
        </div>
    </nav>

    <div class="container">

        <div class="row text-center mb-5">
            <div class="col">
                <h1 class="display-4">Hello, World!</h1>
                <p class="lead text-muted">Resize your browser to see the layout change.</p>
            </div>
        </div>

        <div class="row g-4">

            <div class="col-12 col-md-4">
                <div class="demo-box">
                    <h3>Mobile</h3>
                    <p>I am full width on mobile screens.</p>
                    <a href="action.html" class="btn btn-primary w-100">Action</a>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="demo-box">
                    <h3>Tablet</h3>
                    <p>I share the row on larger screens.</p>
                    <a href="tablet.html" class="btn btn-success w-100">Draw Now</a>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="demo-box">
                    <h3>Desktop</h3>
                    <p>We are equal width columns here.</p>
                    <a href="danger.html" class="btn btn-danger w-100">Danger</a>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
