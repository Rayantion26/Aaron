<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Chess | Fun Zone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        .chess-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 5px solid rgba(255, 255, 255, 0.4);
            user-select: none;
            background: rgba(255, , 255, 0.1);
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(20px, 8vw, 45px);
            /* Responsive font size */
            cursor: pointer;
            position: relative;
        }

        /* Glass / Neon Board Colors */
        .white-square {
            background-color: rgba(255, 255, 255, 0.6);
        }

        .black-square {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Highlight Valid Moves */
        .possible-move::after {
            content: '';
            position: absolute;
            width: 30%;
            height: 30%;
            background: rgba(40, 167, 69, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 10px #28a745;
        }

        .capture-move::after {
            background: rgba(220, 53, 69, 0.6);
            box-shadow: 0 0 10px #dc3545;
        }

        /* Selected Piece */
        .selected {
            background-color: rgba(255, 255, 0, 0.5) !important;
            box-shadow: inset 0 0 20px #ffc107;
        }

        /* Pieces */
        .piece {
            transition: transform 0.2s;
            filter: drop-shadow(0 4px 2px rgba(0, 0, 0, 0.3));
        }

        .piece:hover {
            transform: scale(1.1);
        }

        /* White Pieces */
        .p-w {
            color: #fff;
            text-shadow: 0 0 5px #000;
        }

        /* Black Pieces */
        .p-b {
            color: #333;
            text-shadow: 0 0 2px #fff;
        }

        .status-badge {
            font-size: 1.2rem;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container py-5 text-center chess-container">
        <h1 class="mb-4">Neon Chess ♟️</h1>

        <div class="d-flex justify-content-center gap-3 mb-4">
            <div id="status" class="status-badge shadow-sm">White to Move</div>
        </div>

        <div id="board" class="board mb-4">
            <!-- Generated by JS -->
        </div>

        <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-warning rounded-pill px-4 fw-bold" onclick="resetGame()">🔄 Restart</button>
            <a href="index.html" class="btn btn-secondary rounded-pill px-4">Exit</a>
        </div>
    </div>

    <script src="sound.js"></script>
    <script>
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');

        let game = new Chess();
        let selectedSquare = null;

        // Piece Unicode Map
        const pieces = {
            'w': { 'p': '♙', 'n': '♘', 'b': '♗', 'r': '♖', 'q': '♕', 'k': '♔' },
            'b': { 'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚' }
        };

        function renderBoard() {
            boardEl.innerHTML = '';
            const board = game.board();

            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const square = document.createElement('div');
                    const isWhite = (i + j) % 2 === 0;
                    const squareName = String.fromCharCode(97 + j) + (8 - i);

                    square.className = `square ${isWhite ? 'white-square' : 'black-square'}`;
                    square.dataset.square = squareName;

                    if (selectedSquare === squareName) {
                        square.classList.add('selected');
                    }

                    // Check for valid moves from selected square
                    if (selectedSquare) {
                        const moves = game.moves({ square: selectedSquare, verbose: true });
                        const move = moves.find(m => m.to === squareName);
                        if (move) {
                            square.classList.add(move.flags.includes('c') || move.flags.includes('e') ? 'capture-move' : 'possible-move');
                            square.onclick = () => handleMove(squareName);
                        } else {
                            // If not a move, clicking deselects or selects other
                            square.onclick = () => handleSquareClick(squareName);
                        }
                    } else {
                        square.onclick = () => handleSquareClick(squareName);
                    }

                    // Piece
                    const cell = board[i][j];
                    if (cell) {
                        const pieceSpan = document.createElement('span');
                        pieceSpan.className = `piece p-${cell.color}`;
                        pieceSpan.innerText = pieces[cell.color][cell.type];
                        square.appendChild(pieceSpan);
                    }

                    boardEl.appendChild(square);
                }
            }
            updateStatus();
        }

        function handleSquareClick(square) {
            if (game.game_over()) return;

            // If we click the same square, deselect
            if (selectedSquare === square) {
                selectedSquare = null;
                renderBoard();
                return;
            }

            // Allow selecting only if it's our turn piece (White)
            // Or if we are debugging/local play. Let's force Player = White.
            const piece = game.get(square);
            if (piece && piece.color === 'w') {
                selectedSquare = square;
                Sound.click();
                renderBoard();
            } else {
                selectedSquare = null;
                renderBoard();
            }
        }

        function handleMove(targetSquare) {
            const move = game.move({
                from: selectedSquare,
                to: targetSquare,
                promotion: 'q' // Always promote to queen for simplicity
            });

            if (move) {
                selectedSquare = null;
                if (move.flags.includes('c') || move.flags.includes('e')) {
                    Sound.snap(); // Capture sound
                } else {
                    Sound.startObj(); // Move sound
                }
                renderBoard();

                if (!game.game_over()) {
                    setTimeout(makeAIMove, 500); // AI thinks...
                }
            }
        }

        function makeAIMove() {
            const moves = game.moves();
            if (moves.length === 0) return;

            // Simple "AI": 1. Try to capture. 2. Random.
            // Using verbose moves to see captures
            const detailedMoves = game.moves({ verbose: true });

            // Filter capturing moves
            const captures = detailedMoves.filter(m => m.flags.includes('c') || m.flags.includes('e'));

            let chosenMove;
            if (captures.length > 0) {
                // Pick random capture
                chosenMove = captures[Math.floor(Math.random() * captures.length)];
            } else {
                chosenMove = detailedMoves[Math.floor(Math.random() * detailedMoves.length)];
            }

            game.move(chosenMove.san);

            if (chosenMove.flags.includes('c') || chosenMove.flags.includes('e')) {
                Sound.snap();
            } else {
                Sound.click();
            }
            renderBoard();
        }

        function updateStatus() {
            if (game.in_checkmate()) {
                const winner = game.turn() === 'w' ? 'Black (AI)' : 'White (You)';
                statusEl.innerText = `Checkmate! ${winner} wins!`;
                statusEl.style.background = "#ffc107";
                Sound.win();
            } else if (game.in_draw()) {
                statusEl.innerText = 'Draw!';
            } else if (game.in_check()) {
                statusEl.innerText = 'Check!';
                statusEl.style.background = "#dc3545";
                statusEl.style.color = "#fff";
            } else {
                statusEl.innerText = game.turn() === 'w' ? "Your Turn (White)" : "AI Thinking...";
                statusEl.style.background = "rgba(255,255,255,0.8)";
                statusEl.style.color = "#333";
            }
        }

        function resetGame() {
            game = new Chess();
            selectedSquare = null;
            Sound.startObj();
            renderBoard();
        }

        // Init
        renderBoard();

    </script>
</body>

</html>
