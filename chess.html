<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess | Fun Zone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body {
            background-color: #161512;
            color: #bababa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-layout {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-wrapper {
            display: grid;
            grid-template-columns: minmax(auto, 80vh) 300px;
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        /* Board Styling */
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            aspect-ratio: 1;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            user-select: none;
            width: 100%;
            position: relative;
            background: #b58863;
        }

        .board.checkmate {
            box-shadow: 0 0 50px #ff0000;
            border: 4px solid #ff4444;
        }

        .square {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .white-square {
            background-color: #f0d9b5;
        }

        .black-square {
            background-color: #b58863;
        }

        .selected {
            background-color: rgba(20, 85, 30, 0.5) !important;
        }

        .last-move {
            background-color: rgba(155, 199, 0, 0.41) !important;
        }

        .possible-move::after {
            content: '';
            position: absolute;
            width: 20%;
            height: 20%;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 50%;
        }

        .possible-move:hover::after {
            background: rgba(0, 0, 0, 0.3);
            width: 30%;
            height: 30%;
        }

        .capture-move::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            box-sizing: border-box;
        }

        .check-highlight {
            background: radial-gradient(ellipse at center, #ff0000 0%, transparent 70%) !important;
        }

        .piece-img {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: grab;
            z-index: 10;
        }

        .piece-img:active {
            cursor: grabbing;
        }

        .ghost-piece {
            position: absolute;
            width: 80px;
            height: 80px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.9;
            transform: translate(-50%, -50%);
        }

        /* Sidebar */
        .sidebar {
            background: #262421;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
            max-height: 80vh;
        }

        .player-info {
            padding: 15px;
            display: flex;
            align-items: center;
            background: #302e2c;
            border-bottom: 2px solid #403d39;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #ccc;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .move-history {
            flex-grow: 1;
            padding: 10px;
            background: #262421;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }

        .move-row {
            display: flex;
            padding: 4px 8px;
        }

        .move-row:nth-child(odd) {
            background: #302e2c;
        }

        .move-num {
            color: #6b6b6b;
            width: 30px;
            margin-right: 10px;
        }

        .move-val {
            color: #bababa;
            flex: 1;
        }

        .game-controls {
            padding: 20px;
            background: #302e2c;
            border-top: 2px solid #403d39;
        }

        .status-badge {
            background: #403d39;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: block;
            text-align: center;
        }

        /* Chess Clock */
        .chess-clock {
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 6px;
            background: #1a1a1a;
            color: #ccc;
            min-width: 70px;
            text-align: center;
        }

        .chess-clock.active-clock {
            background: #fff;
            color: #000;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .chess-clock.low-time {
            background: #ff3333;
            color: #fff;
            animation: pulse-clock 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulse-clock {
            from {
                opacity: 1;
            }

            to {
                opacity: 0.6;
            }
        }

        /* Promotion Dialog */
        .promo-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .promo-dialog {
            background: #302e2c;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .promo-dialog h3 {
            color: #fff;
            margin-bottom: 15px;
        }

        .promo-piece {
            width: 70px;
            height: 70px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 8px;
            display: inline-block;
            margin: 5px;
            transition: all 0.15s;
        }

        .promo-piece:hover {
            border-color: #7fc97f;
            background-color: rgba(127, 201, 127, 0.2);
            transform: scale(1.1);
        }

        /* Setup Panel */
        .setup-panel {
            background: #262421;
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            margin: auto;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .setup-panel h2 {
            color: #fff;
            margin-bottom: 30px;
        }

        .setup-panel label {
            color: #bababa;
            font-weight: bold;
        }

        .color-option {
            display: inline-block;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            border: 3px solid #555;
            cursor: pointer;
            margin: 0 8px;
            transition: all 0.15s;
            position: relative;
        }

        .color-option:hover {
            border-color: #aaa;
            transform: scale(1.05);
        }

        .color-option.selected-opt {
            border-color: #7fc97f;
            box-shadow: 0 0 10px rgba(127, 201, 127, 0.3);
        }

        .color-white {
            background: #f0d9b5;
        }

        .color-black {
            background: #403d39;
        }

        .color-random {
            background: linear-gradient(135deg, #f0d9b5 50%, #403d39 50%);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .game-wrapper {
                grid-template-columns: 1fr;
                max-width: 600px;
                gap: 1rem;
            }

            .sidebar {
                max-height: 300px;
            }

            .main-layout {
                padding: 10px;
                display: block;
            }

            .ghost-piece {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary mb-0">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand d-flex align-items-center gap-2">
                <span style="font-size: 1.5rem;">🏠</span>
                <span class="fw-bold">Lichess Clone</span>
            </a>
        </div>
    </nav>

    <!-- Setup Panel (shown before game starts) -->
    <div class="main-layout" id="setupScreen">
        <div class="setup-panel">
            <h2>♟️ New Game</h2>

            <div class="mb-4">
                <label class="d-block mb-2">Play As</label>
                <div class="color-option color-white selected-opt" data-color="w" onclick="selectColor(this)"
                    title="White">
                </div>
                <div class="color-option color-random" data-color="random" onclick="selectColor(this)" title="Random">
                </div>
                <div class="color-option color-black" data-color="b" onclick="selectColor(this)" title="Black">
                </div>
            </div>

            <div class="mb-4">
                <label class="d-block mb-2">Time Control</label>
                <select id="timeSelect" class="form-select bg-dark text-white border-secondary"
                    style="max-width: 250px; margin: auto;">
                    <option value="0">♾️ No Timer (Unlimited)</option>
                    <option value="180">⚡ 3 Minutes (Blitz)</option>
                    <option value="300">⚡ 5 Minutes (Blitz)</option>
                    <option value="600" selected>🕐 10 Minutes (Rapid)</option>
                    <option value="900">🕐 15 Minutes (Rapid)</option>
                    <option value="1800">🐢 30 Minutes (Classical)</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="d-block mb-2">Difficulty</label>
                <select id="setupDifficulty" class="form-select bg-dark text-white border-secondary"
                    style="max-width: 250px; margin: auto;">
                    <option value="0">Beginner (Random)</option>
                    <option value="1">Easy (Careless)</option>
                    <option value="2" selected>Normal (Greedy)</option>
                    <option value="3">Medium (Depth 1)</option>
                    <option value="4">Hard (Depth 2)</option>
                    <option value="5">Very Hard (Depth 3)</option>
                    <option value="6">Extreme (Max)</option>
                </select>
            </div>

            <button class="btn btn-success btn-lg px-5 rounded-pill fw-bold" onclick="beginGame()">
                ⚔️ Start Game
            </button>
        </div>
    </div>

    <!-- Game Screen (hidden until game starts) -->
    <div class="main-layout" id="gameScreen" style="display: none;">
        <div class="game-wrapper">
            <!-- Board Column -->
            <div>
                <!-- Top Player (opponent) -->
                <div class="player-info mb-2 rounded shadow-sm"
                    style="background:none; padding:0; border:none; color: #bababa;">
                    <div class="user-avatar bg-dark text-white" id="topAvatar">🤖</div>
                    <div class="w-100 d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold" id="topName">AI Opponent</div>
                            <div class="small text-muted" id="topLabel">Level: Normal</div>
                        </div>
                        <div class="chess-clock" id="topClock" style="display:none;">10:00</div>
                    </div>
                </div>

                <div id="board" class="board">
                    <!-- JS Generated -->
                </div>

                <!-- Bottom Player (you) -->
                <div class="player-info mt-2 rounded shadow-sm"
                    style="background:none; padding:0; border:none; color: #bababa;">
                    <div class="user-avatar bg-secondary text-white" id="bottomAvatar">👤</div>
                    <div class="w-100 d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold" id="bottomName">You</div>
                            <div class="small text-muted" id="bottomLabel">Rating: 1500</div>
                        </div>
                        <div class="chess-clock" id="bottomClock" style="display:none;">10:00</div>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar shadow">
                <div class="text-center py-2 bg-secondary text-white fw-bold small">
                    Match Info
                </div>

                <div class="p-3 bg-dark border-bottom border-secondary">
                    <label class="form-label text-light small">Difficulty</label>
                    <select id="difficulty" class="form-select form-select-sm bg-secondary text-white border-0"
                        onchange="changeDifficulty()">
                        <option value="0">Beginner (Random)</option>
                        <option value="1">Easy (Careless)</option>
                        <option value="2" selected>Normal (Greedy)</option>
                        <option value="3">Medium (Depth 1)</option>
                        <option value="4">Hard (Depth 2)</option>
                        <option value="5">Very Hard (Depth 3)</option>
                        <option value="6">Extreme (Max)</option>
                    </select>
                </div>

                <div id="moveList" class="move-history">
                    <!-- Moves -->
                </div>

                <div class="game-controls">
                    <div id="status" class="status-badge">White to Move</div>
                    <div class="d-grid gap-2">
                        <button class="btn btn-secondary" onclick="showSetup()">🔄 New Game</button>
                        <button class="btn btn-outline-secondary" onclick="undoMove()">↩️ Undo</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Promotion Dialog (hidden) -->
    <div id="promoOverlay" class="promo-overlay" style="display: none;">
        <div class="promo-dialog">
            <h3>Promote Pawn</h3>
            <div id="promoChoices">
                <!-- JS Generated -->
            </div>
        </div>
    </div>

    <script src="sound.js"></script>
    <script>
        // === DOM Elements ===
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const moveListEl = document.getElementById('moveList');
        const diffSelect = document.getElementById('difficulty');
        const promoOverlay = document.getElementById('promoOverlay');
        const promoChoices = document.getElementById('promoChoices');
        const topClockEl = document.getElementById('topClock');
        const bottomClockEl = document.getElementById('bottomClock');

        // === Game State ===
        let game = new Chess();
        let selectedSquare = null;
        let lastMove = null;
        let difficulty = 2;
        let playerColor = 'w';       // 'w' or 'b'
        let boardFlipped = false;    // true when playing black

        // Timer state
        let timerEnabled = false;
        let timeWhite = 600;         // seconds
        let timeBlack = 600;
        let clockInterval = null;

        // Drag State
        let isDragging = false;
        let draggedPiece = null;
        let dragStartSquare = null;
        let ghostElement = null;

        // Promotion State
        let pendingPromoFrom = null;
        let pendingPromoTo = null;

        // Piece values
        const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

        // Full Piece-Square Tables
        const pst = {
            p: [
                [0, 0, 0, 0, 0, 0, 0, 0],
                [50, 50, 50, 50, 50, 50, 50, 50],
                [10, 10, 20, 30, 30, 20, 10, 10],
                [5, 5, 10, 25, 25, 10, 5, 5],
                [0, 0, 0, 20, 20, 0, 0, 0],
                [5, -5, -10, 0, 0, -10, -5, 5],
                [5, 10, 10, -20, -20, 10, 10, 5],
                [0, 0, 0, 0, 0, 0, 0, 0]
            ],
            n: [
                [-50, -40, -30, -30, -30, -30, -40, -50],
                [-40, -20, 0, 0, 0, 0, -20, -40],
                [-30, 0, 10, 15, 15, 10, 0, -30],
                [-30, 5, 15, 20, 20, 15, 5, -30],
                [-30, 0, 15, 20, 20, 15, 0, -30],
                [-30, 5, 10, 15, 15, 10, 5, -30],
                [-40, -20, 0, 5, 5, 0, -20, -40],
                [-50, -40, -30, -30, -30, -30, -40, -50]
            ],
            b: [
                [-20, -10, -10, -10, -10, -10, -10, -20],
                [-10, 0, 0, 0, 0, 0, 0, -10],
                [-10, 0, 5, 10, 10, 5, 0, -10],
                [-10, 5, 5, 10, 10, 5, 5, -10],
                [-10, 0, 10, 10, 10, 10, 0, -10],
                [-10, 10, 10, 10, 10, 10, 10, -10],
                [-10, 5, 0, 0, 0, 0, 5, -10],
                [-20, -10, -10, -10, -10, -10, -10, -20]
            ],
            r: [
                [0, 0, 0, 0, 0, 0, 0, 0],
                [5, 10, 10, 10, 10, 10, 10, 5],
                [-5, 0, 0, 0, 0, 0, 0, -5],
                [-5, 0, 0, 0, 0, 0, 0, -5],
                [-5, 0, 0, 0, 0, 0, 0, -5],
                [-5, 0, 0, 0, 0, 0, 0, -5],
                [-5, 0, 0, 0, 0, 0, 0, -5],
                [0, 0, 0, 5, 5, 0, 0, 0]
            ],
            q: [
                [-20, -10, -10, -5, -5, -10, -10, -20],
                [-10, 0, 0, 0, 0, 0, 0, -10],
                [-10, 0, 5, 5, 5, 5, 0, -10],
                [-5, 0, 5, 5, 5, 5, 0, -5],
                [0, 0, 5, 5, 5, 5, 0, -5],
                [-10, 5, 5, 5, 5, 5, 0, -10],
                [-10, 0, 5, 0, 0, 0, 0, -10],
                [-20, -10, -10, -5, -5, -10, -10, -20]
            ],
            k: [
                [-30, -40, -40, -50, -50, -40, -40, -30],
                [-30, -40, -40, -50, -50, -40, -40, -30],
                [-30, -40, -40, -50, -50, -40, -40, -30],
                [-30, -40, -40, -50, -50, -40, -40, -30],
                [-20, -30, -30, -40, -40, -30, -30, -20],
                [-10, -20, -20, -20, -20, -20, -20, -10],
                [20, 20, 0, 0, 0, 0, 20, 20],
                [20, 30, 10, 0, 0, 10, 30, 20]
            ]
        };

        // === Setup Functions ===

        function selectColor(el) {
            document.querySelectorAll('.color-option').forEach(e => e.classList.remove('selected-opt'));
            el.classList.add('selected-opt');
        }

        function getSelectedColor() {
            const el = document.querySelector('.color-option.selected-opt');
            const c = el ? el.dataset.color : 'w';
            if (c === 'random') return Math.random() < 0.5 ? 'w' : 'b';
            return c;
        }

        function beginGame() {
            playerColor = getSelectedColor();
            boardFlipped = (playerColor === 'b');

            // Timer
            const timeSec = parseInt(document.getElementById('timeSelect').value);
            timerEnabled = timeSec > 0;
            timeWhite = timeSec;
            timeBlack = timeSec;

            // Difficulty
            difficulty = parseInt(document.getElementById('setupDifficulty').value);
            diffSelect.value = difficulty;

            // Setup UI
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';

            // Update player labels based on color
            if (boardFlipped) {
                // Player is black: top of board = AI (White), bottom = You (Black)
                document.getElementById('topAvatar').textContent = '🤖';
                document.getElementById('topName').textContent = 'AI Opponent';
                document.getElementById('topLabel').textContent = 'Playing White';
                document.getElementById('bottomAvatar').textContent = '👤';
                document.getElementById('bottomName').textContent = 'You';
                document.getElementById('bottomLabel').textContent = 'Playing Black';
            } else {
                document.getElementById('topAvatar').textContent = '🤖';
                document.getElementById('topName').textContent = 'AI Opponent';
                document.getElementById('topLabel').textContent = 'Playing Black';
                document.getElementById('bottomAvatar').textContent = '👤';
                document.getElementById('bottomName').textContent = 'You';
                document.getElementById('bottomLabel').textContent = 'Playing White';
            }

            // Clocks
            if (timerEnabled) {
                topClockEl.style.display = 'inline-block';
                bottomClockEl.style.display = 'inline-block';
                updateClockDisplay();
                startClock();
            } else {
                topClockEl.style.display = 'none';
                bottomClockEl.style.display = 'none';
            }

            // Reset game
            game = new Chess();
            selectedSquare = null;
            lastMove = null;
            renderBoard();

            // If player chose black, AI moves first
            if (playerColor === 'b') {
                setTimeout(makeAIMove, 400);
            }

            Sound.startObj();
        }

        function showSetup() {
            stopClock();
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'flex';
        }

        // === Clock Functions ===

        function formatTime(seconds) {
            if (seconds <= 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function updateClockDisplay() {
            // Determine which clock is top/bottom based on flip
            let topTime, bottomTime;
            if (boardFlipped) {
                // Top = White (AI), Bottom = Black (Player)
                topTime = timeWhite;
                bottomTime = timeBlack;
            } else {
                // Top = Black (AI), Bottom = White (Player)
                topTime = timeBlack;
                bottomTime = timeWhite;
            }

            topClockEl.textContent = formatTime(topTime);
            bottomClockEl.textContent = formatTime(bottomTime);

            // Active clock styling
            const currentTurn = game.turn(); // 'w' or 'b'
            const topColor = boardFlipped ? 'w' : 'b';
            const bottomColor = boardFlipped ? 'b' : 'w';

            topClockEl.classList.toggle('active-clock', currentTurn === topColor && !game.game_over());
            bottomClockEl.classList.toggle('active-clock', currentTurn === bottomColor && !game.game_over());

            // Low time warning
            topClockEl.classList.toggle('low-time', topTime <= 30 && topTime > 0 && currentTurn === topColor);
            bottomClockEl.classList.toggle('low-time', bottomTime <= 30 && bottomTime > 0 && currentTurn === bottomColor);
        }

        function startClock() {
            stopClock();
            if (!timerEnabled) return;
            clockInterval = setInterval(() => {
                if (game.game_over()) { stopClock(); return; }
                const turn = game.turn();
                if (turn === 'w') {
                    timeWhite -= 0.1;
                    if (timeWhite <= 0) { timeWhite = 0; handleTimeout('w'); return; }
                } else {
                    timeBlack -= 0.1;
                    if (timeBlack <= 0) { timeBlack = 0; handleTimeout('b'); return; }
                }
                updateClockDisplay();
            }, 100);
        }

        function stopClock() {
            if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
        }

        function handleTimeout(color) {
            stopClock();
            const loser = color === 'w' ? 'White' : 'Black';
            const isPlayer = color === playerColor;
            statusEl.innerText = `${loser} ran out of time!`;
            statusEl.style.color = isPlayer ? '#ff4444' : '#44ff44';
            if (isPlayer) Sound.lose(); else Sound.win();
            updateClockDisplay();
            renderBoard();
        }

        // === Piece URL ===

        function getPieceUrl(color, type) {
            const c = color === 'w' ? 'w' : 'b';
            const t = type.toUpperCase();
            return `https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett/${c}${t}.svg`;
        }

        function changeDifficulty() {
            difficulty = parseInt(diffSelect.value);
        }

        // === Board Rendering ===

        function renderBoard() {
            boardEl.innerHTML = '';
            boardEl.classList.remove('checkmate');
            if (game.in_checkmate()) boardEl.classList.add('checkmate');

            const board = game.board();

            // Determine render order based on flip
            const ranks = boardFlipped ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
            const files = boardFlipped ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];

            ranks.forEach(rIndex => {
                files.forEach(cIndex => {
                    const square = document.createElement('div');
                    const isWhite = (rIndex + cIndex) % 2 === 0;
                    const squareName = String.fromCharCode(97 + cIndex) + (8 - rIndex);
                    const cell = board[rIndex][cIndex];

                    square.className = `square ${isWhite ? 'white-square' : 'black-square'}`;
                    square.dataset.square = squareName;

                    if (selectedSquare === squareName) square.classList.add('selected');
                    if (lastMove && (lastMove.from === squareName || lastMove.to === squareName)) {
                        square.classList.add('last-move');
                    }

                    if (cell && cell.type === 'k' && game.in_check() && cell.color === game.turn()) {
                        square.classList.add('check-highlight');
                    }

                    // Move hints
                    if (selectedSquare && !isDragging) {
                        const moves = game.moves({ square: selectedSquare, verbose: true });
                        const move = moves.find(m => m.to === squareName);
                        if (move) {
                            const isCapture = move.flags.includes('c') || move.flags.includes('e');
                            square.classList.add(isCapture ? 'capture-move' : 'possible-move');
                            square.onclick = (e) => { e.stopPropagation(); handleMove(squareName); };
                        }
                    }

                    square.onclick = () => handleSquareClick(squareName);

                    if (cell) {
                        const img = document.createElement('div');
                        img.className = 'piece-img';
                        img.style.backgroundImage = `url('${getPieceUrl(cell.color, cell.type)}')`;

                        if (cell.color === game.turn() && cell.color === playerColor && !game.game_over()) {
                            img.onmousedown = (e) => startDrag(e, squareName, cell);
                            img.ontouchstart = (e) => startDrag(e, squareName, cell);
                        }

                        if (isDragging && dragStartSquare === squareName) {
                            img.style.opacity = '0.2';
                        }

                        square.appendChild(img);
                    }

                    boardEl.appendChild(square);
                });
            });

            updateStatus();
            updateMoveList();
            if (timerEnabled) updateClockDisplay();
        }

        // === Drag & Drop ===

        function startDrag(e, square, piece) {
            e.preventDefault();
            if (game.game_over() || piece.color !== game.turn() || piece.color !== playerColor) return;

            isDragging = true;
            dragStartSquare = square;
            draggedPiece = piece;
            selectedSquare = square;
            renderBoard();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            ghostElement = document.createElement('div');
            ghostElement.className = 'ghost-piece';
            ghostElement.style.backgroundImage = `url('${getPieceUrl(piece.color, piece.type)}')`;
            ghostElement.style.left = clientX + 'px';
            ghostElement.style.top = clientY + 'px';
            document.body.appendChild(ghostElement);

            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('touchmove', onDragMove, { passive: false });
            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('touchend', onDragEnd);
        }

        function onDragMove(e) {
            e.preventDefault();
            if (!ghostElement) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            ghostElement.style.left = clientX + 'px';
            ghostElement.style.top = clientY + 'px';
        }

        function onDragEnd(e) {
            isDragging = false;
            document.removeEventListener('mousemove', onDragMove);
            document.removeEventListener('touchmove', onDragMove);
            document.removeEventListener('mouseup', onDragEnd);
            document.removeEventListener('touchend', onDragEnd);

            if (ghostElement) { ghostElement.remove(); ghostElement = null; }

            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            const targetEl = document.elementFromPoint(clientX, clientY);
            if (!targetEl) { renderBoard(); dragStartSquare = null; return; }
            const squareEl = targetEl.closest('.square');

            if (squareEl) {
                const targetSquare = squareEl.dataset.square;
                if (targetSquare && targetSquare !== dragStartSquare) {
                    handleMove(targetSquare);
                } else {
                    renderBoard();
                }
            } else {
                renderBoard();
            }
            dragStartSquare = null;
        }

        // === Game Logic ===

        function handleSquareClick(square) {
            if (game.game_over()) return;
            if (game.turn() !== playerColor) return; // Not player's turn

            const piece = game.get(square);

            if (selectedSquare === square) {
                selectedSquare = null;
                renderBoard();
                return;
            }

            if (selectedSquare) {
                const moves = game.moves({ square: selectedSquare, verbose: true });
                const move = moves.find(m => m.to === square);
                if (move) {
                    handleMove(square);
                    return;
                }
            }

            if (piece && piece.color === game.turn() && piece.color === playerColor) {
                selectedSquare = square;
                renderBoard();
            } else {
                selectedSquare = null;
                renderBoard();
            }
        }

        function handleMove(targetSquare) {
            // Check if this is a promotion move
            const moves = game.moves({ square: selectedSquare, verbose: true });
            const move = moves.find(m => m.to === targetSquare);

            if (!move) {
                renderBoard();
                return;
            }

            // If promotion, show dialog
            if (move.flags.includes('p')) {
                pendingPromoFrom = selectedSquare;
                pendingPromoTo = targetSquare;
                showPromotionDialog(game.turn());
                return;
            }

            executeMove(selectedSquare, targetSquare, null);
        }

        function executeMove(from, to, promotion) {
            const moveObj = { from: from, to: to };
            if (promotion) moveObj.promotion = promotion;

            const move = game.move(moveObj);

            if (move) {
                selectedSquare = null;
                lastMove = { from: move.from, to: move.to };

                if (move.flags.includes('c') || move.flags.includes('e')) {
                    Sound.snap();
                } else {
                    Sound.startObj();
                }

                renderBoard();

                if (!game.game_over() && game.turn() !== playerColor) {
                    setTimeout(makeAIMove, 200);
                }
            } else {
                renderBoard();
            }
        }

        // === Promotion Dialog ===

        function showPromotionDialog(color) {
            promoChoices.innerHTML = '';
            const pieces = ['q', 'r', 'b', 'n'];
            const names = ['Queen', 'Rook', 'Bishop', 'Knight'];

            pieces.forEach((p, i) => {
                const el = document.createElement('div');
                el.className = 'promo-piece';
                el.style.backgroundImage = `url('${getPieceUrl(color, p)}')`;
                el.title = names[i];
                el.onclick = () => {
                    promoOverlay.style.display = 'none';
                    executeMove(pendingPromoFrom, pendingPromoTo, p);
                    pendingPromoFrom = null;
                    pendingPromoTo = null;
                };
                promoChoices.appendChild(el);
            });

            promoOverlay.style.display = 'flex';
        }

        // === AI Logic ===

        function makeAIMove() {
            if (game.game_over()) return;
            const moves = game.moves({ verbose: true });
            if (moves.length === 0) return;

            let chosenMove = null;

            if (difficulty === 0) {
                chosenMove = moves[Math.floor(Math.random() * moves.length)];
            } else if (difficulty === 1) {
                if (Math.random() > 0.7) chosenMove = getBestMove(moves);
                else chosenMove = moves[Math.floor(Math.random() * moves.length)];
            } else if (difficulty === 2) {
                chosenMove = getBestMove(moves);
            } else if (difficulty === 3) {
                chosenMove = getBestMoveMinimax(1);
            } else if (difficulty === 4) {
                chosenMove = getBestMoveMinimax(2);
            } else if (difficulty >= 5) {
                chosenMove = getBestMoveMinimax(3);
            }

            if (!chosenMove) chosenMove = moves[Math.floor(Math.random() * moves.length)];

            const aiColor = playerColor === 'w' ? 'b' : 'w';
            game.move(chosenMove);

            lastMove = { from: chosenMove.from, to: chosenMove.to };

            if (chosenMove.flags.includes('c') || chosenMove.flags.includes('e')) {
                Sound.snap();
            } else {
                Sound.click();
            }
            renderBoard();
        }

        function evaluateBoard(color) {
            let total = 0;
            game.board().forEach((row, r) => {
                row.forEach((p, c) => {
                    if (!p) return;
                    let val = pieceValues[p.type] || 0;

                    // PST bonus for all piece types
                    const table = pst[p.type];
                    if (table) {
                        const rTable = p.color === 'w' ? r : 7 - r;
                        val += table[rTable][c];
                    }

                    if (p.color === color) total += val;
                    else total -= val;
                });
            });
            return total;
        }

        function getBestMove(moves) {
            let bestMove = null;
            let maxVal = -Infinity;
            const aiColor = playerColor === 'w' ? 'b' : 'w';
            moves.forEach(move => {
                game.move(move);
                let val = evaluateBoard(aiColor);
                game.undo();
                if (val > maxVal) {
                    maxVal = val;
                    bestMove = move;
                }
            });
            return bestMove || moves[0];
        }

        function getBestMoveMinimax(depth) {
            let bestMove = null;
            let bestValue = -Infinity;
            const moves = game.moves({ verbose: true });
            const aiColor = playerColor === 'w' ? 'b' : 'w';

            moves.sort((a, b) =>
                (b.flags.includes('c') || b.flags.includes('e')) -
                (a.flags.includes('c') || a.flags.includes('e'))
            );

            for (let move of moves) {
                game.move(move);
                let value = minimax(depth - 1, -Infinity, Infinity, false, aiColor);
                game.undo();
                if (value > bestValue) {
                    bestValue = value;
                    bestMove = move;
                }
            }
            return bestMove || moves[0];
        }

        function minimax(depth, alpha, beta, isMaximizing, aiColor) {
            if (depth === 0 || game.game_over()) {
                return evaluateBoard(aiColor);
            }

            const moves = game.moves({ verbose: true });
            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let move of moves) {
                    game.move(move);
                    let evalScore = minimax(depth - 1, alpha, beta, false, aiColor);
                    game.undo();
                    maxEval = Math.max(maxEval, evalScore);
                    alpha = Math.max(alpha, evalScore);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let move of moves) {
                    game.move(move);
                    let evalScore = minimax(depth - 1, alpha, beta, true, aiColor);
                    game.undo();
                    minEval = Math.min(minEval, evalScore);
                    beta = Math.min(beta, evalScore);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        // === Utils ===

        function undoMove() {
            // Undo AI move + player move
            game.undo();
            game.undo();
            lastMove = null;
            selectedSquare = null;
            renderBoard();
        }

        function updateStatus() {
            if (game.in_checkmate()) {
                const winnerColor = game.turn() === 'w' ? 'Black' : 'White';
                const isPlayerWin = game.turn() !== playerColor;
                statusEl.innerText = isPlayerWin ? `You win by Checkmate! 🎉` : `AI wins by Checkmate!`;
                statusEl.style.color = isPlayerWin ? '#44ff44' : '#ff4444';
                if (isPlayerWin) Sound.win(); else Sound.lose();
                stopClock();
            } else if (game.in_draw()) {
                statusEl.innerText = 'Draw! ½-½';
                statusEl.style.color = '#fff';
                stopClock();
            } else if (game.in_check()) {
                statusEl.innerText = 'CHECK! ⚠️';
                statusEl.style.color = '#ff9900';
            } else {
                const isPlayerTurn = game.turn() === playerColor;
                statusEl.innerText = isPlayerTurn ? "Your Turn" : "AI Thinking...";
                statusEl.style.color = '#fff';
            }
        }

        function updateMoveList() {
            const history = game.history();
            moveListEl.innerHTML = '';
            for (let i = 0; i < history.length; i += 2) {
                const row = document.createElement('div');
                row.className = 'move-row';
                const num = document.createElement('span');
                num.className = 'move-num';
                num.innerText = (i / 2 + 1) + '.';
                const wMove = document.createElement('span');
                wMove.className = 'move-val';
                wMove.innerText = history[i];
                const bMove = document.createElement('span');
                bMove.className = 'move-val';
                bMove.innerText = history[i + 1] || '';
                row.appendChild(num);
                row.appendChild(wMove);
                row.appendChild(bMove);
                moveListEl.appendChild(row);
            }
            moveListEl.scrollTop = moveListEl.scrollHeight;
        }

        // Start on setup screen
    </script>
