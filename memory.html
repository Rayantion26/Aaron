<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory - Matrix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <style>
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Updated Tile Styles for better visibility */
        .tile {
            aspect-ratio: 1;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            border: 4px solid transparent;
            opacity: 0.8;
        }

        .tile:active {
            transform: scale(0.95);
        }

        .tile.active {
            opacity: 1 !important;
            border-color: #fff !important;
            box-shadow: 0 0 20px 5px currentColor !important;
            transform: scale(1.05);
            z-index: 10;
        }

        /* Unclickable state when sequence is playing */
        .game-grid.playing {
            pointer-events: none;
            cursor: not-allowed;
            opacity: 0.9;
        }

        .game-grid.playing .tile {
            cursor: not-allowed;
        }

        .status-text {
            height: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body class="text-center p-4">
    <div class="container py-5 text-center">
        <h1 class="mb-4">Memory Matrix 🧠</h1>

        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-2 px-3">
                <h3 class="m-0">Score: <span id="score">0</span></h3>
                <h3 class="m-0 text-warning">Replays: <span id="replays">3</span></h3>
                <h3 class="m-0 text-danger">Lives: <span id="lives">❤️❤️❤️</span></h3>
            </div>

            <!-- Timer Bar -->
            <div class="progress mb-3" style="height: 10px; opacity: 0;" id="timerContainer">
                <div class="progress-bar bg-warning progress-bar-striped progress-bar-animated" id="timerBar"
                    style="width: 100%"></div>
            </div>

            <div id="status" class="status-text text-primary fs-4">Press Start to Play!</div>
        </div>

        <div class="game-grid mb-5" id="grid">
            <!-- Tiles generated by JS -->
        </div>

        <div class="d-flex justify-content-center gap-2">
            <button id="startBtn" class="btn btn-primary btn-lg rounded-pill px-5" onclick="startGame()">Start
                Game</button>
            <button id="replayBtn" class="btn btn-warning btn-lg rounded-pill px-5" style="display: none;"
                onclick="replaySequence()">Replay ↺</button>
        </div>
        <a href="index.html" class="btn btn-secondary mt-3 d-block mx-auto" style="max-width: 200px;">Back to Home</a>
    </div>

    <script src="sound.js"></script>
    <script>
        const grid = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const replaysEl = document.getElementById('replays');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const replayBtn = document.getElementById('replayBtn');
        const timerContainer = document.getElementById('timerContainer');
        const timerBar = document.getElementById('timerBar');

        let colors = [
            '#ffc107', '#0d6efd', '#dc3545', '#198754', '#6610f2',
            '#fd7e14', '#0dcaf0', '#d63384', '#20c997'
        ];

        // Tones for each position (pentatonic-ish)
        const tones = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33];

        let sequence = [];
        let playerSequence = [];
        let score = 0;
        let lives = 3;
        let replays = 3;
        let roundsPassed = 0;
        let isPlaying = false;
        let canClick = false;
        let roundTime = 10000; // Starting time per round (ms)
        let flashSpeed = 800; // Starting flash interval (ms)
        let timerInterval;
        let startTime;

        // Create Grid
        function createGrid() {
            grid.innerHTML = '';
            // Shuffle colors for "change color every turn" effect if requested, or just initial setup
            // User asked "Change color every turn", let's shuffle on every round start
            colors.forEach((color, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.index = i;
                tile.style.backgroundColor = color; // Initial color
                tile.style.color = color; // Used for box-shadow currentColor
                tile.onclick = () => handleTileClick(i);
                grid.appendChild(tile);
            });
        }
        createGrid(); // Initial

        function shuffleColors() {
            // Fisher-Yates shuffle
            for (let i = colors.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [colors[i], colors[j]] = [colors[j], colors[i]];
            }
            // Apply new colors
            const tiles = document.querySelectorAll('.tile');
            tiles.forEach((tile, i) => {
                tile.style.backgroundColor = colors[i];
                tile.style.color = colors[i];
            });
        }

        function startGame() {
            Sound.startObj();
            sequence = [];
            playerSequence = [];
            score = 0;
            lives = 3;
            replays = 3;
            roundsPassed = 0;
            roundTime = 10000; // Reset time difficulty
            flashSpeed = 800; // Reset speed difficulty
            scoreEl.innerText = score;
            updateLives();
            updateReplays();
            isPlaying = true;
            startBtn.style.display = 'none';
            replayBtn.style.display = 'none';
            statusEl.innerText = "Watch carefully...";

            shuffleColors(); // Shuffle start
            setTimeout(nextRound, 1000);
        }

        function updateLives() {
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            livesEl.innerText = hearts;
        }

        function nextRound() {
            playerSequence = [];
            canClick = false;
            stopTimer();
            timerContainer.style.opacity = 0;
            statusEl.innerText = "Watch carefully...";
            statusEl.style.color = "#0d6efd"; // Reset color

            // Visual lock
            grid.classList.add('playing');
            replayBtn.style.display = 'none'; // Hide replay during sequence playback

            // Randomly shuffle colors EVERY turn if that's what user wanted?
            // "change th color every turn" -> Yes, let's do it for max confusion/fun
            shuffleColors();

            // NEW: Generate a completely fresh sequence based on current level
            // Level 1 = 1 step, Level 2 = 2 steps, etc.
            // Score starts at 0, so length = score + 1
            const sequenceLength = score + 1;
            sequence = [];
            for (let k = 0; k < sequenceLength; k++) {
                sequence.push(Math.floor(Math.random() * 9));
            }

            // Reduce time for next turn (game gets faster)
            if (roundTime > 3000) roundTime -= 500;

            // Speed up the sequence playback (harder!)
            if (flashSpeed > 300) flashSpeed -= 50;

            // Play sequence
            // Recursive setTimeout instead of setInterval to handle variable speed if we wanted dynamic within round,
            // but for round-based fixed speed, setInterval is fine. Wait... setInterval interval cannot be changed while running.
            // But we recreate the interval every round, so it picks up the NEW flashSpeed.

            playSequenceStep(0);
        }

        function playSequenceStep(i) {
            if (i >= sequence.length) {
                setTimeout(() => {
                    startPlayerTurn();
                }, 500);
                return;
            }

            flashTile(sequence[i]);

            // Schedule next step
            setTimeout(() => {
                playSequenceStep(i + 1);
            }, flashSpeed);
        }


        function startPlayerTurn() {
            canClick = true;
            // Remove visual lock
            grid.classList.remove('playing');

            statusEl.innerText = "Your Turn!";
            startTimer();
            // Start fresh sequence check for this turn
            playerSequence = [];

            // Show replay button
            replayBtn.style.display = 'inline-block';
            replayBtn.disabled = replays <= 0;
        }

        function startTimer() {
            timerContainer.style.opacity = 1;
            const start = Date.now();
            timerBar.classList.remove('bg-danger');
            timerBar.classList.add('bg-warning');

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - start;
                const remaining = roundTime - elapsed;
                const pct = (remaining / roundTime) * 100;

                timerBar.style.width = pct + "%";

                if (remaining <= 3000) {
                    timerBar.classList.remove('bg-warning');
                    timerBar.classList.add('bg-danger'); // Panic mode
                }

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    handleMistake("Time's Up!");
                }
            }, 50);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function flashTile(index) {
            const tiles = document.querySelectorAll('.tile');
            const tile = tiles[index];
            tile.classList.add('active');
            Sound.note(tones[index]);

            // Flash duration should be proportional to speed, maybe half?
            // If speed is 300ms, flash needs to be short.
            setTimeout(() => {
                tile.classList.remove('active');
            }, flashSpeed * 0.6);
        }

        function handleTileClick(index) {
            if (!canClick || !isPlaying) return;

            flashTile(index);
            playerSequence.push(index);

            // Check specific step correctness
            if (playerSequence[playerSequence.length - 1] !== sequence[playerSequence.length - 1]) {
                handleMistake("Wrong Tile!");
                return;
            }

            // Check if round complete
            if (playerSequence.length === sequence.length) {
                stopTimer();
                score++;
                scoreEl.innerText = score;

                // Earn replay logic
                roundsPassed++;
                if (roundsPassed % 3 === 0) {
                    replays++;
                    updateReplays();
                    // Optional: Visual cue for earning
                    replaysEl.style.color = '#198754';
                    setTimeout(() => replaysEl.style.color = '', 1000);
                }

                canClick = false;
                grid.classList.add('playing'); // Lock immediately on win
                statusEl.innerText = "Good job!";
                statusEl.style.color = "#198754"; // Green
                Sound.win(); // Little arpeggio
                setTimeout(nextRound, 1000);
            }
        }

        function handleMistake(msg) {
            Sound.lose();
            lives--;
            updateLives();
            canClick = false;
            stopTimer();

            // Lock
            grid.classList.add('playing');

            statusEl.innerText = msg;
            statusEl.style.color = "#dc3545"; // Red

            const tiles = document.querySelectorAll('.tile');
            grid.style.transform = "translateX(10px)";
            setTimeout(() => grid.style.transform = "translateX(-10px)", 50);
            setTimeout(() => grid.style.transform = "none", 100);

            if (lives <= 0) {
                gameOver();
            } else {
                // Formatting lives
                setTimeout(() => {
                    statusEl.innerText = "Replaying Sequence...";
                    setTimeout(() => {
                        // Replay sequence logic (using recursive for consistency with new playSequenceStep)
                        playSequenceStep(0);
                        // IMPORTANT: startPlayerTurn will be called at end of playback,
                        // which will wipe playerSequence = [] and unlock UI.
                    }, 1000);
                }, 1000);
            }
        }

        function updateReplays() {
            replaysEl.innerText = replays;
            if (replays > 0 && canClick) {
                replayBtn.disabled = false;
            } else {
                replayBtn.disabled = true;
            }
        }

        function replaySequence() {
            if (replays <= 0 || !canClick) return;
            replays--;
            updateReplays();

            canClick = false;
            replayBtn.disabled = true;
            stopTimer(); // Pause timer while replaying? Or keep it running? 
            // Usually replay uses time, but let's pause it to be fair or restart it after.
            // Let's pause visual timer but "penalty" is using the replay stock.
            // Actually implementation plan didn't specify timer behavior, but pausing seems fair.
            timerContainer.style.opacity = 0.5;

            statusEl.innerText = "Replaying...";
            grid.classList.add('playing');

            playSequenceStep(0);
        }

        function gameOver() {
            isPlaying = false;
            canClick = false;
            stopTimer();
            grid.classList.remove('playing'); // Unlock maybe? Or keep locked.
            statusEl.innerHTML = `<span class="text-danger fw-bold">GAME OVER! Score: ${score}</span>`;
            startBtn.innerText = "Play Again";
            startBtn.style.display = 'inline-block';
            replayBtn.style.display = 'none';
        }
    </script>
</body>

</html>
